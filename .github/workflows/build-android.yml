name: Build Android APK

# 手动触发：仓库页 Actions → Build Android APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      debug:
        description: '打 debug 包（体积更大、带 trace）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'art/**'
      - '**/*.md'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 腾出磁盘空间
        # runner 自带一堆用不到的 SDK/工具链，Android NDK + hxcpp 吃盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-4].* /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Haxe 4.3.7
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: 缓存 haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('building/libs-mobile.xml') }}

      - name: 安装依赖库
        # Setup.hx 靠 #if desktop 选 libs.xml，在 Linux runner 上会选成桌面那套；
        # 必须显式 --lib 指到 libs-mobile.xml，否则装的是 desktop 依赖、Android 编不过。
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxe -cp commandline -D analyzer-optimize --run Main setup --lib=building/libs-mobile.xml

      - name: 写 Android 配置
        # lime 读环境变量拿 SDK/NDK 路径；这里再显式落一份配置，避免 runner 上猜不到
        run: |
          haxelib run lime config ANDROID_SDK_ROOT "$ANDROID_HOME" || true
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME" || true
          haxelib run lime config JAVA_HOME "$JAVA_HOME" || true

      - name: 编译 APK
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            haxelib run lime build android -debug -verbose
          else
            haxelib run lime build android -release
          fi

      - name: 收集产物
        run: |
          mkdir -p out
          find export -name '*.apk' -exec cp {} out/ \;
          ls -lh out/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: codename-engine-android
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 14
