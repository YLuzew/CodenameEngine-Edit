name: Build Android APK

# 手动触发：仓库页 Actions → Build Android APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      debug:
        description: '打 debug 包（体积更大、带 trace）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'art/**'
      - '**/*.md'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 探一下 runner 自带的 Android SDK
        # ubuntu-latest 预装 SDK（含 cmdline-tools），这里不装任何 setup-android action：
        # 那个 action 会去改写预装的 sdkmanager 版本，实测在 runner 上直接 exit 1。
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls "$SDK" || true
          which sdkmanager || find "$SDK" -name sdkmanager -type f | head -3
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 NDK + platform（用预装 sdkmanager）
        run: |
          SDK="${{ env.SDK }}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -r | head -1)"
          [ -x "$SM" ] || SM="$(which sdkmanager)"
          echo "用 $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          yes | "$SM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653" || \
            "$SM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/ndk/" || true

      - name: Haxe 4.3.7
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: 缓存 haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('building/libs-mobile.xml') }}

      - name: 安装依赖库
        # Setup.hx 靠 #if desktop 选 libs.xml，Linux runner 上会选成桌面那套；
        # 必须显式 --lib 指到 libs-mobile.xml，否则装的是 desktop 依赖、Android 编不过。
        # 另：仓库里已把 libs-mobile.xml 的 openfl 分支从 old 改成 master
        # （old 缺 Matrix3D.transformVectorToOutput / Vector3D.crossProductToOutput，foxlite 编不过）。
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          echo "haxelib repo: $(haxelib config)"
          haxe -cp commandline -D analyzer-optimize --run Main setup --lib=building/libs-mobile.xml
          echo "--- 编译期真正用的仓库 ---"
          echo "项目内 .haxelib: $(ls -d .haxelib 2>/dev/null || echo 无)"
          for f in .haxelib/openfl/git/src/openfl/geom/Matrix3D.hx ~/haxelib/openfl/git/src/openfl/geom/Matrix3D.hx; do
            [ -f "$f" ] && echo "$f transformVectorToOutput=$(grep -c transformVectorToOutput "$f")"
          done

      - name: 写 lime 配置
        # lime 判定的三个键名是 ANDROID_SETUP / ANDROID_SDK / ANDROID_NDK_ROOT（不是 ANDROID_SDK_ROOT）。
        # AndroidPlatform.hx:110 先查 ANDROID_SETUP，缺了就报「You need to run lime setup android」。
        run: |
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          echo "--- ~/.lime/config.json ---"
          cat ~/.lime/config.json || true

      - name: 编译 APK
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            haxelib run lime build android -debug
          else
            haxelib run lime build android -release
          fi

      - name: 收集产物
        if: always()
        run: |
          mkdir -p out
          find export -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/ || true

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codename-engine-android
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 14
