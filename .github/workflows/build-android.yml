name: Build Android APK

# 手动触发：仓库页 Actions → Build Android APK → Run workflow
# 构建参数照抄官方移动端仓库 azmlpoh/CodenameEngine-Mobile 的 .github/workflows/android.yml
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App 版本号（留空用 project.xml 里的）'
        required: false
        default: ''
        type: string
      experimental:
        description: '开 COMPILE_EXPERIMENTAL（官方默认开）'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - 'art/**'
      - '**/*.md'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 定版本号
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            sed -i 's/version="[0-9.]*"/version="${{ inputs.version }}"/' project.xml
            echo "APP_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            V=$(grep -o 'version="[0-9.]*"' project.xml | head -1 | sed 's/version="//;s/"//')
            echo "APP_VERSION=$V" >> $GITHUB_ENV
          fi
          echo "版本: $APP_VERSION"

      - name: Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Android NDK r25c
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: 缓存
        uses: actions/cache@v4
        with:
          key: cache-build-android-${{ hashFiles('building/libs-mobile.xml','project.xml') }}
          path: |
            ~/.gradle
            .haxelib/
            ~/haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-

      - name: 装依赖
        # 与官方一致：不传 --lib。Setup.hx 里 #if desktop 在 Linux 为真、走 libs.xml，
        # 但本仓库的 libs.xml 与 libs-mobile.xml 只在 lime 那一行不同（都用 openfl old），
        # 官方 CI 也是这么跑的。
        run: |
          rm -rf ~/.haxelib
          haxelib setup ~/haxelib
          haxe -cp commandline -D analyzer-optimize --run Main setup -si

      - name: 配置 lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: 修 haxelib 指向 git 版
        run: |
          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flixel-animate git
          haxelib set hxdiscord_rpc git

      - name: 编译
        run: |
          if [ "${{ inputs.experimental }}" == "false" ]; then
            haxelib run lime build android -final -D ONLY_ARM64 --app-version="$APP_VERSION"
          else
            haxelib run lime build android -final -D ONLY_ARM64 -D COMPILE_EXPERIMENTAL --app-version="$APP_VERSION"
          fi

      - name: 传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodenameEngine-Android-${{ env.APP_VERSION }}
          path: export/release/android/bin/app/build/outputs/apk/release/*
          if-no-files-found: warn
          retention-days: 14
